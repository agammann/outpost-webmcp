name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webmcp-results
          path: test-results/native-webmcp.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
