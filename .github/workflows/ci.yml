name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outpost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:audit-policy
      - run: pnpm security:audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - run: pnpm package:release
      - run: python scripts/unpack-release.py --out ../outpost-clean-consumer
      - run: pnpm --dir ../outpost-clean-consumer install --frozen-lockfile
      - run: pnpm --dir ../outpost-clean-consumer build
      - run: pnpm --dir ../outpost-clean-consumer test:e2e
      - run: pnpm --dir ../outpost-clean-consumer test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outpost-source
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-and-audit-results
          path: |
            test-results/
            reports/dependency-*
            ${{ runner.workspace }}/outpost-clean-consumer/test-results/
          overwrite: true
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: outpost-source
          path: release-artifacts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
