name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outpost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Verify published-release no-op with read-only client
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            const messages = [];
            const readOnly = {
              paginate: (...args) => github.paginate(...args),
              rest: { repos: { listReleases: github.rest.repos.listReleases } },
            };
            const testContext = { eventName: 'push', ref: 'refs/heads/main', sha: context.sha, repo: context.repo };
            await publish({ github: readOnly, context: testContext, core: { info: (message) => messages.push(message) } });
            if (!messages.some((message) => message.includes('already published; leaving it unchanged.'))) {
              throw new Error('Expected the existing published release to remain unchanged.');
            }
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:audit-policy
      - run: pnpm security:audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - run: python scripts/test-unpack-release.py
      - run: pnpm package:release
      - run: python scripts/unpack-release.py --out ../outpost-clean-consumer
      - run: pnpm --dir ../outpost-clean-consumer install --frozen-lockfile
      - run: pnpm --dir ../outpost-clean-consumer exec node --test scripts/bounded-braces.test.cjs
      - run: pnpm --dir ../outpost-clean-consumer build
      - run: pnpm --dir ../outpost-clean-consumer test:e2e
      - run: pnpm --dir ../outpost-clean-consumer test:webmcp --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/native-webmcp.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outpost-source
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Download release artifact
        id: artifact-download-first
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outpost-source
          path: release-artifacts-roundtrip
      - name: Wait for artifact visibility
        if: steps.artifact-download-first.outcome == 'failure'
        run: sleep 10
      - name: Retry release artifact download
        id: artifact-download-second
        if: steps.artifact-download-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outpost-source
          path: release-artifacts-roundtrip
      - name: Wait for artifact visibility again
        if: steps.artifact-download-second.outcome == 'failure'
        run: sleep 20
      - name: Final release artifact download attempt
        if: steps.artifact-download-second.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outpost-source
          path: release-artifacts-roundtrip
      - run: diff -r release-artifacts release-artifacts-roundtrip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-and-audit-results
          path: |
            test-results/
            reports/dependency-*
            ${{ runner.workspace }}/outpost-clean-consumer/test-results/
          overwrite: true
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outpost-source
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });

  artifact-retry-guard-test:
    name: Verify artifact failure guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Missing artifact attempt one
        id: first
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Missing artifact attempt two
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Missing artifact attempt three
        id: third
        if: steps.second.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Require all missing-artifact attempts to fail
        if: always()
        env:
          FIRST: ${{ steps.first.outcome }}
          SECOND: ${{ steps.second.outcome }}
          THIRD: ${{ steps.third.outcome }}
        run: test "$FIRST" = failure && test "$SECOND" = failure && test "$THIRD" = failure
